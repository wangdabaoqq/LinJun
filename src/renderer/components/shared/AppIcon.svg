<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGradient" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" /> <!-- Indigo-600 -->
      <stop offset="100%" stop-color="#06B6D4" /> <!-- Cyan-500 -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1024" height="1024" rx="220" fill="#0F172A" /> <!-- Slate-900 Background -->
  
  <!-- Abstract Geometric Shape: Stylized 'L' / Connectivity Path -->
  <path d="M312 312 H 512 L 512 512 H 712 V 712 H 312 V 312 Z" fill="url(#mainGradient)" filter="url(#glow)" opacity="0.9"/>
  <circle cx="712" cy="312" r="80" fill="#06B6D4" />
  <circle cx="312" cy="712" r="80" fill="#4F46E5" />
  
  <!-- Subtle Grid Overlay -->
  <path d="M112 112 H 912 V 912 H 112 Z" stroke="white" stroke-width="2" stroke-opacity="0.1" fill="none"/>
</svg>