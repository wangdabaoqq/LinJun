appId: com.linjun.app
productName: 霖君
artifactName: "LinJun-${version}-${arch}.${ext}"
directories:
  buildResources: resources
  output: dist

asar: true
compression: normal

files:
  - "!**/.git/*"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!.editorconfig"
  - "!**/._*"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}"
  - "!**/{appveyor.yml,.travis.yml,circle.yml}"
  - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"

extraResources:
  - from: "resources/icons/icons/32x32.png"
    to: "icons/tray-icon.png"

mac:
  extraResources:
    - from: "resources/binaries/darwin-${arch}/"
      to: "binaries/darwin-${arch}/"
      filter:
        - "**/*"
        - "!LICENSE"
        - "!README.md"
        - "!README_CN.md"
        - "!.DS_Store"
        - "!.gitkeep"
        - "!static"
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  target:
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  extraResources:
    - from: "resources/binaries/win32-x64/"
      to: "binaries/win32-x64/"
      filter:
        - "**/*"
        - "!LICENSE"
        - "!README.md"
        - "!README_CN.md"
        - "!.DS_Store"
        - "!.gitkeep"
        - "!static"
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]

linux:
  extraResources:
    - from: "resources/binaries/linux-x64/"
      to: "binaries/linux-x64/"
      filter:
        - "**/*"
        - "!LICENSE"
        - "!README.md"
        - "!README_CN.md"
        - "!.DS_Store"
        - "!.gitkeep"
        - "!static"
  icon: resources/icon.png
  category: Development
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  differentialPackage: false

publish:
  provider: github
  owner: wangdabaoqq
  repo: LinJun
  releaseType: draft
