name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
            cli-arch: arm64
            electron-args: --mac --arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
            cli-arch: amd64
            electron-args: --mac --x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            cli-arch: amd64
            electron-args: --linux
          - os: windows-latest
            platform: win32
            arch: x64
            cli-arch: amd64
            electron-args: --win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Download CLIProxyAPIPlus binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_DIR="resources/binaries/${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$TARGET_DIR"
          
          if [ "${{ matrix.platform }}" = "win32" ]; then
            CLI_PLATFORM="windows"
            EXT="zip"
            BINARY_NAME="cliproxy.exe"
            SRC_NAME="cli-proxy-api-plus.exe"
          else
            CLI_PLATFORM="${{ matrix.platform }}"
            EXT="tar.gz"
            BINARY_NAME="cliproxy"
            SRC_NAME="cli-proxy-api-plus"
          fi
          
          # Get latest version tag via authenticated request
          LATEST_TAG=$(curl -sH "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/router-for-me/CLIProxyAPIPlus/releases/latest \
            | grep -o '"tag_name": "[^"]*"' | cut -d'"' -f4)
          VERSION="${LATEST_TAG#v}"
          
          DOWNLOAD_URL="https://github.com/router-for-me/CLIProxyAPIPlus/releases/download/${LATEST_TAG}/CLIProxyAPIPlus_${VERSION}_${CLI_PLATFORM}_${{ matrix.cli-arch }}.${EXT}"
          
          echo "Downloading: $DOWNLOAD_URL"
          curl -fSL -o "archive.${EXT}" "$DOWNLOAD_URL"
          
          if [ "$EXT" = "tar.gz" ]; then
            tar -xzf "archive.${EXT}"
          else
            unzip -o "archive.${EXT}"
          fi
          
          FOUND=$(find . -maxdepth 2 -type f -name "$SRC_NAME" | head -1)
          if [ -n "$FOUND" ]; then
            mv "$FOUND" "${TARGET_DIR}/${BINARY_NAME}"
            chmod +x "${TARGET_DIR}/${BINARY_NAME}"
            echo "Installed: ${TARGET_DIR}/${BINARY_NAME}"
          else
            echo "::error::Binary $SRC_NAME not found in archive"
            ls -laR
            exit 1
          fi
          
          rm -f "archive.${EXT}"

      - name: Build Electron app
        run: bun run build

      - name: Package for ${{ matrix.platform }}
        run: bunx electron-builder ${{ matrix.electron-args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
