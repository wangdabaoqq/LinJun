name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
            cli-arch: arm64
            electron-args: --mac --arm64
          - os: macos-13
            platform: darwin
            arch: x64
            cli-arch: amd64
            electron-args: --mac --x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            cli-arch: amd64
            electron-args: --linux
          - os: windows-latest
            platform: win32
            arch: x64
            cli-arch: amd64
            electron-args: --win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Download CLIProxyAPIPlus binary
        shell: bash
        run: |
          mkdir -p resources/binaries/${{ matrix.platform }}-${{ matrix.arch }}
          
          # Get latest release assets
          RELEASE_INFO=$(curl -s https://api.github.com/repos/router-for-me/CLIProxyAPIPlus/releases/latest)
          
          # Platform name mapping
          if [ "${{ matrix.platform }}" = "win32" ]; then
            CLI_PLATFORM="windows"
            EXT="zip"
            BINARY_NAME="cliproxy.exe"
          else
            CLI_PLATFORM="${{ matrix.platform }}"
            EXT="tar.gz"
            BINARY_NAME="cliproxy"
          fi
          
          # Find download URL matching pattern: CLIProxyAPIPlus_*_{platform}_{arch}.{ext}
          PATTERN="CLIProxyAPIPlus_[^_]*_${CLI_PLATFORM}_${{ matrix.cli-arch }}"
          DOWNLOAD_URL=$(echo "$RELEASE_INFO" | grep -oE "https://github.com/router-for-me/CLIProxyAPIPlus/releases/download/[^\"]*${PATTERN}[^\"]*" | head -1)
          
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Could not find binary for ${CLI_PLATFORM}-${{ matrix.cli-arch }}"
            echo "Available assets:"
            echo "$RELEASE_INFO" | grep -o '"name": "[^"]*"' | head -20
            exit 1
          fi
          
          echo "Downloading from: $DOWNLOAD_URL"
          ARCHIVE_FILE="cliproxy-archive.${EXT}"
          curl -L -o "$ARCHIVE_FILE" "$DOWNLOAD_URL"
          
          # Extract archive
          if [ "$EXT" = "tar.gz" ]; then
            tar -xzf "$ARCHIVE_FILE"
          else
            unzip -o "$ARCHIVE_FILE"
          fi
          
          # Find and move binary
          if [ "${{ matrix.platform }}" = "win32" ]; then
            FOUND_BINARY=$(find . -maxdepth 2 -type f -name "cli-proxy-api-plus.exe" | head -1)
          else
            FOUND_BINARY=$(find . -maxdepth 2 -type f -name "cli-proxy-api-plus" | head -1)
          fi
          if [ -n "$FOUND_BINARY" ]; then
            mv "$FOUND_BINARY" "resources/binaries/${{ matrix.platform }}-${{ matrix.arch }}/${BINARY_NAME}"
            chmod +x "resources/binaries/${{ matrix.platform }}-${{ matrix.arch }}/${BINARY_NAME}"
            echo "Binary installed: resources/binaries/${{ matrix.platform }}-${{ matrix.arch }}/${BINARY_NAME}"
          else
            echo "::error::Could not find binary in archive"
            ls -la
            exit 1
          fi
          
          # Cleanup
          rm -f "$ARCHIVE_FILE"

      - name: Build Electron app
        run: bun run build

      - name: Package for ${{ matrix.platform }}
        run: bunx electron-builder ${{ matrix.electron-args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
